# Git hooks, installed by `lefthook install` (wired to `pnpm install` via the
# `prepare` script). Git can bypass client-side hooks with `--no-verify`; the
# matching GitHub Actions jobs remain the authoritative remote gate.

pre-commit:
  commands:
    biome:
      # Lint + format + organize imports on the staged files only; safe fixes
      # are written back and re-staged so the commit contains the fixed code.
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css,html}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

pre-push:
  # Keep the expensive gates sequential. A failure stops the push before the
  # next job starts, and the integration runner always uses an isolated database.
  parallel: false
  jobs:
    - name: repository check
      # Full-repo gate: biome lint + format + import order (`pnpm check`).
      run: pnpm check

    - name: typecheck
      run: pnpm exec tsc --noEmit

    - name: unit tests
      # Coverage thresholds (95%) are part of the gate, not just test results.
      run: pnpm test:coverage

    - name: integration tests
      # Fresh SQLite migrations, production build, and local Chromium smoke tests.
      run: pnpm test:integration

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.1.2"

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests and coverage gate
        run: pnpm test:coverage

      - name: Upload unit coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run integration tests
        run: pnpm test:integration

      - name: Upload integration test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: Container (${{ matrix.target }})
    if: ${{ needs.unit.result == 'success' && needs.integration.result == 'success' }}
    needs:
      - unit
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: runtime
            image: ghcr.io/bestony/google-health-connector
            cache-scope: google-health-connector-runtime
            title: Google Health Connector
            description: Google Health Connector web application
          - target: migration
            image: ghcr.io/bestony/google-health-connector-migration
            cache-scope: google-health-connector-migration
            title: Google Health Connector migration helper
            description: Google Health Connector database migration helper
    env:
      # A manual run may target a branch other than main. Such a run publishes
      # only its immutable SHA tag; latest is reserved for main.
      PUBLISH_IMAGE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        if: ${{ env.PUBLISH_IMAGE == 'true' }}
        # v4.2.0
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      - name: Set up Docker Buildx
        # v4.2.0
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Set image build timestamp
        id: build-info
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: ${{ env.PUBLISH_IMAGE == 'true' }}
        # v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        # v6.2.0
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ env.PUBLISH_IMAGE == 'true' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.build-info.outputs.created }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish container
        id: build
        # v7.3.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ env.PUBLISH_IMAGE == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}

      - name: Inspect published manifest
        if: ${{ env.PUBLISH_IMAGE == 'true' }}
        run: docker buildx imagetools inspect "${{ matrix.image }}@${{ steps.build.outputs.digest }}"

  vercel-status:
    name: Vercel deployment status
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - unit
      - integration
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      statuses: write
    steps:
      - name: Verify CI jobs passed
        if: ${{ needs.unit.result != 'success' || needs.integration.result != 'success' }}
        run: |
          echo "Unit or integration tests did not pass."
          exit 1

      - name: 'notify vercel'
        if: ${{ always() }}
        # The v1 tag still targets the deprecated Node 20 action runtime. This
        # upstream commit contains the Node 24 runtime upgrade until a new tag
        # is published.
        uses: 'vercel/repository-dispatch/actions/status@44f4d342ebc265c58167a2aa77d5a0d5a6eb20fd'
        with:
          name: 'Vercel - google-health-connector: lint'

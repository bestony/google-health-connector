services:
  postgresql:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: google_health_connector
      POSTGRES_USER: google_health_connector
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username=google_health_connector --dbname=google_health_connector
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  migration:
    image: ${IMAGE_REGISTRY:-ghcr.io/bestony}/google-health-connector-migration:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: "postgresql://google_health_connector:${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}@postgresql:5432/google_health_connector"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      MCP_OAUTH_ENABLED: ${MCP_OAUTH_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgresql:
        condition: service_healthy
    restart: "no"

  app:
    image: ${IMAGE_REGISTRY:-ghcr.io/bestony}/google-health-connector:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: "postgresql://google_health_connector:${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}@postgresql:5432/google_health_connector"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      MCP_OAUTH_ENABLED: ${MCP_OAUTH_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      HEALTH_SYNC_ENABLED: ${HEALTH_SYNC_ENABLED:-false}
      CRON_SECRET: ${CRON_SECRET:-}
      HEALTH_SYNC_BUDGET_MS: ${HEALTH_SYNC_BUDGET_MS:-120000}
      HEALTH_SYNC_BACKFILL_DAYS: ${HEALTH_SYNC_BACKFILL_DAYS:-730}
      HEALTH_SYNC_DATA_TYPES: ${HEALTH_SYNC_DATA_TYPES:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
    ports:
      - ${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000
    depends_on:
      migration:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped

  sync-cron:
    # Pokes the app's own sync endpoint on an interval. The endpoint decides
    # how much work one call does and holds a database lease while it runs, so
    # this sidecar only needs to call it — overlapping calls are answered with
    # `skipped_locked` and a 200.
    # Started only with `--profile sync`. Compose interpolates every service,
    # profile or not, so CRON_SECRET is checked by the command itself instead of
    # `:?`; otherwise a deployment with the sync off would still need it.
    profiles: ["sync"]
    image: curlimages/curl:8.11.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      # One line per command on purpose: YAML's folded scalar keeps the newline
      # on any line indented further than the first, so a "readable" multi-line
      # curl silently becomes several broken commands.
      - '[ -n "$$CRON_SECRET" ] || { echo "[sync-cron] CRON_SECRET is required by the sync profile"; exit 1; }; while true; do curl -fsS -m 300 -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/sync > /dev/null || echo "[sync-cron] call failed"; sleep "$${SYNC_INTERVAL_SECONDS:-600}"; done'
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-600}
    depends_on:
      app:
        condition: service_started
    init: true
    restart: unless-stopped

volumes:
  postgresql-data:

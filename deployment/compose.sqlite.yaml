services:
  sqlite-permissions:
    image: node:22-bookworm-slim
    command:
      - sh
      - -c
      - chown 1000:1000 /data
    volumes:
      - sqlite-data:/data
    restart: "no"

  migration:
    image: ${IMAGE_REGISTRY:-ghcr.io/bestony}/google-health-connector-migration:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: file:/data/google-health-connector.db
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      MCP_OAUTH_ENABLED: ${MCP_OAUTH_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      sqlite-permissions:
        condition: service_completed_successfully
    restart: "no"

  app:
    image: ${IMAGE_REGISTRY:-ghcr.io/bestony}/google-health-connector:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: file:/data/google-health-connector.db
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      MCP_OAUTH_ENABLED: ${MCP_OAUTH_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
    ports:
      - ${APP_PORT:-3000}:3000
    volumes:
      - sqlite-data:/data
    depends_on:
      migration:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped

volumes:
  sqlite-data:

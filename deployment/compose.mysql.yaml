services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: google_health_connector
      MYSQL_USER: google_health_connector
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  migration:
    image: ${IMAGE_REGISTRY:-ghcr.io/bestony}/google-health-connector-migration:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: "mysql://google_health_connector:${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}@mysql:3306/google_health_connector"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      MCP_OAUTH_ENABLED: ${MCP_OAUTH_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  app:
    image: ${IMAGE_REGISTRY:-ghcr.io/bestony}/google-health-connector:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: "mysql://google_health_connector:${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}@mysql:3306/google_health_connector"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      MCP_OAUTH_ENABLED: ${MCP_OAUTH_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
    ports:
      - ${APP_PORT:-3000}:3000
    depends_on:
      migration:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped

volumes:
  mysql-data:
